services:
  victim:
    build:
      context: ./victim
    environment:
      LAB_SSH_PASSWORD: ${LAB_SSH_PASSWORD:-labsecretpassword123}
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/log/auth.log"]
      interval: 1s
      timeout: 1s
      retries: 30
    ports:
      - "127.0.0.1:2222:22"
    volumes:
      - victim_logs:/var/log
    networks:
      - trusttrace_net

  vault:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "3000"
      RSYSLOG_HOST: "0.0.0.0"
      RSYSLOG_PORT: "5140"
      AGENT_PUBLIC_KEY_HEX: ${AGENT_PUBLIC_KEY_HEX:-0x1111111111111111111111111111111111111111111111111111111111111111}
      VAULT_SIGNER_PRIVATE_KEY: ${VAULT_SIGNER_PRIVATE_KEY:-0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      EVIDENCE_DIRECTORY: /data/vault
      EVIDENCE_SQLITE_PATH: /data/vault/evidence-index.sqlite3
      LOCAL_RPC_URL: ${LOCAL_RPC_URL:-http://host.docker.internal:8545}
      EVIDENCE_ANCHOR_LOCAL_ADDRESS: ${EVIDENCE_ANCHOR_LOCAL_ADDRESS:-}
      LOCAL_RELAYER_PRIVATE_KEY: ${LOCAL_RELAYER_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      LOCAL_CHAIN_ID: ${LOCAL_CHAIN_ID:-31337}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/health || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:5140:5140"
    volumes:
      - vault_data:/data/vault
    networks:
      - trusttrace_net

  agent:
    build:
      context: ..
      dockerfile: services/agent/Dockerfile
    depends_on:
      victim:
        condition: service_healthy
      vault:
        condition: service_healthy
    environment:
      AGENT_SOURCE_ID: ${AGENT_SOURCE_ID:-0x1111111111111111111111111111111111111111111111111111111111111111}
      AGENT_STREAM_ID: ${AGENT_STREAM_ID:-auth.log}
      AGENT_FILE_IDENTITY: ${AGENT_FILE_IDENTITY:-auth.log}
      VAULT_BASE_URL: ${VAULT_BASE_URL:-http://vault:3000}
      AUTH_LOG_PATH: /var/log/auth.log
      AGENT_STATE_DIR: /var/lib/trusttrace-agent
      AGENT_POLL_INTERVAL_MS: ${AGENT_POLL_INTERVAL_MS:-250}
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-5000}
      AGENT_RETRY_DELAY_MS: ${AGENT_RETRY_DELAY_MS:-1000}
    volumes:
      - victim_logs:/var/log:ro
      - agent_state:/var/lib/trusttrace-agent
    networks:
      - trusttrace_net

volumes:
  victim_logs:
  agent_state:
  vault_data:

networks:
  trusttrace_net:
    driver: bridge
