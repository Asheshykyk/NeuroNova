services:
  - type: web
    name: trusttrace-vault
    runtime: docker
    dockerfilePath: backend/Dockerfile
    plan: starter
    healthCheckPath: /health
    disk:
      name: vault-data
      mountPath: /data/vault
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DOCKER
        value: "true"
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: RSYSLOG_HOST
        value: 0.0.0.0
      - key: RSYSLOG_PORT
        value: "5140"
      - key: EVIDENCE_DIRECTORY
        value: /data/vault
      - key: EVIDENCE_SQLITE_PATH
        value: /data/vault/evidence-index.sqlite3
      - key: VAULT_SIGNER_PRIVATE_KEY
        sync: false
      - key: TRUSTED_AGENT_PUBLIC_KEYS_JSON
        sync: false
      - key: READ_API_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
