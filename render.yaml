services:
  - type: web
    name: trusttrace-vault
    runtime: docker
    dockerfilePath: backend/Dockerfile
    plan: starter
    healthCheckPath: /health
    disk:
      name: vault-data
      mountPath: /data/vault
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DOCKER
        value: "true"
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: RSYSLOG_HOST
        value: 0.0.0.0
      - key: RSYSLOG_PORT
        value: "5140"
      - key: EVIDENCE_DIRECTORY
        value: /data/vault
      - key: EVIDENCE_SQLITE_PATH
        value: /data/vault/evidence-index.sqlite3
      - key: AGENT_PUBLIC_KEY_HEX
        value: "0x4fdca0e7c7f545bbb564917724963cf898e992efb2e7188bcae09a1862c23803"
      - key: VAULT_SIGNER_PRIVATE_KEY
        value: "0xcb29eeba7ce945a733284c66ef3437b67b531f52c8d0e084a2e3518c2028d572"
